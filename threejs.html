<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// ForgeRoom Abstract Collaboration Object
// A central "core" sphere representing AI, with orbiting smaller spheres representing team members
const group = new THREE.Group();
scene.add(group);

const coreGeometry = new THREE.IcosahedronGeometry(1.5, 1);
const coreMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x00E5FF, 
    wireframe: true, 
    transparent: true, 
    opacity: 0.8 
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
group.add(core);

const innerCore = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.8, 0),
    new THREE.MeshPhongMaterial({ color: 0x00E5FF, emissive: 0x00E5FF, emissiveIntensity: 0.5 })
);
group.add(innerCore);

const satellites = [];
const satCount = 4;
for (let i = 0; i < satCount; i++) {
    const satGroup = new THREE.Group();
    const satGeom = new THREE.SphereGeometry(0.2, 16, 16);
    const satMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
    const sat = new THREE.Mesh(satGeom, satMat);
    
    const angle = (i / satCount) * Math.PI * 2;
    sat.position.x = Math.cos(angle) * 3;
    sat.position.y = Math.sin(angle) * 3;
    
    satGroup.add(sat);
    group.add(satGroup);
    satellites.push({ group: satGroup, speed: 0.01 + Math.random() * 0.02 });
}

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040, 2));

function animate() {
    requestAnimationFrame(animate);
    
    group.rotation.y += 0.005;
    core.rotation.x += 0.01;
    
    satellites.forEach(s => {
        s.group.rotation.z += s.speed;
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
